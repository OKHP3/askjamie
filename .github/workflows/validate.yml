name: Site Validation
# Both validate-site.py and audit-site.py must pass for the build to succeed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-compatibility:
    name: Python ${{ matrix.python }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test supported and candidate Python versions
        run: |
          python3 -m pip install -r requirements-qa.txt
          python3 -m pytest

  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-qa.txt
          installed=false
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline && node --input-type=module -e "import('playwright').then(() => console.log('Playwright dependency resolved from node_modules.'))"; then
              installed=true
              break
            fi
            echo "Dependency installation attempt ${attempt} did not produce a usable Playwright installation."
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then
            echo "Playwright dependency installation failed after 3 attempts."
            exit 1
          fi
          npx playwright install --with-deps chromium

      - name: Verify dependency manifest contracts
        run: python3 scripts/technology-audit.py --check

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Verify shared asset fingerprints and deferred loading
        run: python3 scripts/cache-bust.py --check

      - name: Run link checker
        run: python3 scripts/check-links.py

      - name: Verify lazy-image behavior on locked Playwright and Chromium
        run: >-
          python3 -m pytest -q
          tests/test_release_checks.py::test_responsive_qa_browser_fixture_isolates_pages_and_preserves_failures

      - name: Run regression tests
        # The Playwright fixture already ran as a separate compatibility step.
        run: >-
          python3 -m pytest
          -k "not responsive_qa_browser_fixture_isolates_pages_and_preserves_failures"

      - name: Verify committed search index is current
        run: python3 scripts/build-search-index.py --check

      - name: Run full browser responsive QA and JavaScript smoke tests
        run: |
          python3 -m http.server 5000 --bind 127.0.0.1 >/tmp/askjamie-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null
          node scripts/responsive-qa.mjs --base=http://127.0.0.1:5000
          node tests/test_js_smoke.spec.mjs
          node tests/test_gpt_transition.spec.mjs
          node tests/test_foundry_reflow.spec.mjs
          node tests/test_universe_map.spec.mjs
          node scripts/experience-qa.cjs

      - name: Run site auditor
        # Checks search-index consistency (template contamination, missing pages),
        # sitemap reconciliation, image hygiene, and governance checks.
        # Exits 1 if any issues are found.
        run: python3 scripts/audit-site.py --quiet

      - name: Prepare public Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/prepare-pages-artifact.py --output .scratch/pages-release

      - name: Preserve validated Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pages-site-${{ github.sha }}
          path: .scratch/pages-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy validated site to GitHub Pages
    needs: [validate, python-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pages-site-${{ github.sha }}
          path: dist-pages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'dist-pages'
          # The validated allowlist includes public .well-known files.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
