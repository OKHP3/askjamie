name: Hosted JavaScript Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: hosted-js-smoke
  cancel-in-progress: false

jobs:
  hosted-js-smoke:
    runs-on: ubuntu-latest
    name: Verify published JavaScript behavior
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install browser test dependencies
        run: |
          installed=false
          for attempt in 1 2 3; do
            if npm ci --no-audit --no-fund --prefer-offline && node --input-type=module -e "import('playwright').then(() => console.log('Playwright dependency resolved from node_modules.'))"; then
              installed=true
              break
            fi
            echo "Dependency installation attempt ${attempt} did not produce a usable Playwright installation."
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$installed" != true ]; then
            echo "Playwright dependency installation failed after 3 attempts."
            exit 1
          fi
          npx playwright install --with-deps chromium

      - name: Run smoke test against published site
        env:
          BASE_URL: https://askjamie.bot
        run: |
          mkdir -p artifacts/hosted-js-smoke
          set +e
          status=1
          for attempt in 1 2 3; do
            node tests/test_js_smoke.spec.mjs 2>&1 | tee "artifacts/hosted-js-smoke/smoke-output-${attempt}.txt"
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then break; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          cat artifacts/hosted-js-smoke/smoke-output-*.txt > artifacts/hosted-js-smoke/smoke-output.txt
          {
            echo "# Hosted JavaScript Smoke Summary"
            echo
            echo "- Checked (UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Published origin: ${BASE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            if [ "$status" -eq 0 ]; then
              echo "- Result: PASS"
            else
              echo "- Result: FAIL (exit ${status})"
            fi
            echo
            echo "## Smoke output"
            echo
            echo '```text'
            cat artifacts/hosted-js-smoke/smoke-output.txt
            echo '```'
          } > artifacts/hosted-js-smoke/summary.md
          cat artifacts/hosted-js-smoke/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retain smoke summary and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-js-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/hosted-js-smoke/
          if-no-files-found: error
          retention-days: 90
